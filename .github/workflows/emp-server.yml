name: Build and deploy JAR app to Azure Web App - emp-server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java version
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: 'target/*.jar'

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: java-app
          path: target

      # ⚙️ REMOVED THE FAILING AZURE LOGIN STEP COMPLETELY

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'emp-server'
          slot-name: 'Production'
          package: 'target/*.jar'
          # 🔐 ADDED: Direct authentication via your App Service Publish Profile token
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
